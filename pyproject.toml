[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-crm-aurumdecor"
version = "0.1.0"
description = "ERP + CRM + WhatsApp"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.1",
  "pydantic>=2.6.1",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.27",
  "alembic>=1.13.1",
  "psycopg2-binary>=2.9.9",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.0",
  "pyjwt>=2.8.0",
  "httpx>=0.27.0",
  "streamlit>=1.31.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.5",
  "ruff>=0.3.0",
  "mypy>=1.8.0"
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.mypy]
python_version = "3.11"
strict = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
